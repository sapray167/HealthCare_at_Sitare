<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Healthcare Admin AI — Demo</title>
<style>
  :root {
    --ink: #16213a;
    --muted: #6b7688;
    --line: #e3e7ee;
    --accent: #2f6fed;
    --accent-soft: #eaf1ff;
    --high: #1e9e6d;
    --medium: #d99a1b;
    --low: #e0672c;
    --missing: #d9455f;
    --bg: #f6f8fb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--ink); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  select, input[type=file] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  .row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #b9c6dd; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .field {
    display: grid;
    grid-template-columns: 220px 1fr 90px;
    gap: 10px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .field:last-child { border-bottom: none; }
  .field label { margin: 0; font-size: 13px; color: var(--ink); }
  .field input {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    width: 100%;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .badge.high { background: #e5f7ee; color: var(--high); }
  .badge.medium { background: #fdf3de; color: var(--medium); }
  .badge.low { background: #fdeee5; color: var(--low); }
  .badge.missing { background: #fce6ea; color: var(--missing); }
  .missing input { border-color: var(--missing); background: #fff8f9; }
  .notes {
    font-size: 13px;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 12px 14px;
    border-radius: 8px;
    margin-top: 14px;
  }
  .stat-row { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--ink); font-size: 18px; display: block; }
  pre#draftOut {
    white-space: pre-wrap;
    background: #fbfbfd;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
    font-size: 13px;
    line-height: 1.6;
  }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .hidden { display: none; }
  .spinner { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Healthcare Admin AI</h1>
  <div class="sub">Upload a form → review extracted fields → generate the outgoing paperwork. Human reviews everything before it goes anywhere.</div>

  <div class="card">
    <h2>1. Upload a form</h2>
    <div class="row">
      <div>
        <label for="formType">Form type</label>
        <select id="formType">
          <option value="prior_authorization">Prior Authorization Request</option>
          <option value="insurance_claim">Insurance Claim Submission</option>
        </select>
      </div>
      <div>
        <label for="fileInput">Document (PDF, PNG, or JPG)</label>
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp">
      </div>
    </div>
    <button id="extractBtn">Extract fields</button>
    <span class="spinner hidden" id="extractSpinner">Reading document…</span>
  </div>

  <div class="card hidden" id="reviewCard">
    <h2>2. Review &amp; correct</h2>
    <div id="fieldsContainer"></div>
    <div class="notes hidden" id="notesBox"></div>
    <div class="stat-row">
      <div class="stat"><b id="statTotal">0</b>fields extracted</div>
      <div class="stat"><b id="statMissing">0</b>need attention</div>
    </div>
    <div class="actions">
      <button id="generateBtn">Generate draft paperwork</button>
    </div>
  </div>

  <div class="card hidden" id="draftCard">
    <h2>3. Drafted outgoing document</h2>
    <pre id="draftOut"></pre>
    <div class="actions">
      <button class="secondary" id="downloadBtn">Download .txt</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000";
let currentSchema = null;
let currentFormType = null;

async function loadSchemas() {
  const res = await fetch(`${API_BASE}/form-types`);
  return res.json();
}

let SCHEMAS = {};
loadSchemas().then(s => SCHEMAS = s).catch(() => {
  console.warn("Could not reach backend at " + API_BASE + " — make sure it's running.");
});

document.getElementById("extractBtn").addEventListener("click", async () => {
  const fileInput = document.getElementById("fileInput");
  const formType = document.getElementById("formType").value;
  if (!fileInput.files.length) { alert("Choose a file first."); return; }

  currentFormType = formType;
  currentSchema = SCHEMAS[formType];

  const btn = document.getElementById("extractBtn");
  const spinner = document.getElementById("extractSpinner");
  btn.disabled = true;
  spinner.classList.remove("hidden");

  const fd = new FormData();
  fd.append("file", fileInput.files[0]);
  fd.append("form_type", formType);

  try {
    const res = await fetch(`${API_BASE}/extract`, { method: "POST", body: fd });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Extraction failed");
    }
    const data = await res.json();
    renderFields(data);
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.disabled = false;
    spinner.classList.add("hidden");
  }
});

function renderFields(data) {
  const container = document.getElementById("fieldsContainer");
  container.innerHTML = "";
  const labels = currentSchema ? currentSchema.fields : {};
  let missingCount = 0;
  let total = 0;

  for (const [key, info] of Object.entries(data.fields || {})) {
    total++;
    const conf = info.confidence || "missing";
    if (conf === "missing") missingCount++;

    const row = document.createElement("div");
    row.className = "field" + (conf === "missing" ? " missing" : "");

    const label = document.createElement("label");
    label.textContent = labels[key] || key;

    const input = document.createElement("input");
    input.type = "text";
    input.value = info.value || "";
    input.dataset.key = key;

    const badge = document.createElement("span");
    badge.className = "badge " + conf;
    badge.textContent = conf;

    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(badge);
    container.appendChild(row);
  }

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statMissing").textContent = missingCount;

  const notesBox = document.getElementById("notesBox");
  if (data.notes) {
    notesBox.textContent = "Note: " + data.notes;
    notesBox.classList.remove("hidden");
  } else {
    notesBox.classList.add("hidden");
  }

  document.getElementById("reviewCard").classList.remove("hidden");
  document.getElementById("draftCard").classList.add("hidden");
}

document.getElementById("generateBtn").addEventListener("click", async () => {
  const inputs = document.querySelectorAll("#fieldsContainer input");
  const fields = {};
  inputs.forEach(inp => { fields[inp.dataset.key] = inp.value; });

  const fd = new FormData();
  fd.append("form_type", currentFormType);
  fd.append("fields_json", JSON.stringify(fields));

  const btn = document.getElementById("generateBtn");
  btn.disabled = true;
  btn.textContent = "Generating…";

  try {
    const res = await fetch(`${API_BASE}/generate`, { method: "POST", body: fd });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Generation failed");
    }
    const text = await res.text();
    document.getElementById("draftOut").textContent = text;
    document.getElementById("draftCard").classList.remove("hidden");
    document.getElementById("draftCard").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Generate draft paperwork";
  }
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const text = document.getElementById("draftOut").textContent;
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${currentFormType || "draft"}_output.txt`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
